name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: horizon
          POSTGRES_PASSWORD: horizon_ci_only
          POSTGRES_DB: horizon_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U horizon -d horizon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://horizon:horizon_ci_only@127.0.0.1:54329/horizon_test
      TEST_DATABASE_URL: postgresql://horizon:horizon_ci_only@127.0.0.1:54329/horizon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm run vendor:verify
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm run web:typecheck
      - run: npm run web:build
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3
      - run: forge test --root contracts -vv
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:routes
      - run: npm run subgraph:prepare
      - run: npm run subgraph:codegen
      - run: npm run subgraph:build
