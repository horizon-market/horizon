    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/horizon_events.wasm

network: sepolia

modules:
  - name: map_registry_events
    kind: map
    initialBlock: 11663746
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:horizon.v1.HorizonEvents

  - name: store_markets
    kind: store
    initialBlock: 11663746
    updatePolicy: set_if_not_exists
    valueType: string
    inputs:
      - map: map_registry_events

  - name: map_horizon_events
    kind: map
    initialBlock: 11663746
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - store: store_markets
        mode: get
    output:
      type: proto:horizon.v1.HorizonEvents

